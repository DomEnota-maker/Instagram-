name: MediaLoader icon build
on:
  push:
    branches:
      - feature/medialoader-1-4-2-icon-fix
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test, lint, assemble
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Attach APK to private prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MediaLoader_1.4.2_icon-fix_debug.apk
          gh release create medialoader-1.4.2-icon-fix-20261005 MediaLoader_1.4.2_icon-fix_debug.apk \
            --target "$GITHUB_SHA" \
            --title "MediaLoader 1.4.2 icon fix (debug)" \
            --notes "Debug APK with restored launcher icon. Tests, lint, and assembleDebug." \
            --prerelease
