name: Recognition CI

on:
  push:
    branches:
      - 'feature/1.4.8-instagram-shazam'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare one-time upstream ShazamIO recognition fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/shazamio/ShazamIO/master/examples/data/Gloria.ogg \
            --output /tmp/Gloria.ogg
          ffmpeg -hide_banner -loglevel error -y -i /tmp/Gloria.ogg \
            -ac 1 -ar 16000 -acodec pcm_s16le -f s16le /tmp/gloria.pcm
      - name: Unit tests, live Shazam smoke and lint
        env:
          SHAZAM_LIVE_PCM: /tmp/gloria.pcm
        run: gradle :app:testDebugUnitTest :app:lintDebug
