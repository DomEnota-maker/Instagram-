name: Android CI

on:
  push:
    branches: [feature/medialoader-1-2-youtube]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test, lint and assemble release
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Report release checksum
        run: sha256sum app/build/outputs/apk/release/app-release-unsigned.apk
