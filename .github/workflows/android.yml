name: Android alpha
on:
  push:
    branches: [feature/medialoader-1-2-youtube]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test, lint, assemble
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MediaLoader-lint-report
          path: app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
      - name: Collect signing tools
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" signing-tools/
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" signing-tools/
          split -b 20m -d -a 2 app/build/outputs/apk/release/app-release-unsigned.apk release-part-
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-alpha-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-signing-tools
          path: signing-tools/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-00
          path: release-part-00
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-01
          path: release-part-01
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-02
          path: release-part-02
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-03
          path: release-part-03
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-04
          path: release-part-04
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-05
          path: release-part-05
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-06
          path: release-part-06
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-07
          path: release-part-07
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-08
          path: release-part-08
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-09
          path: release-part-09
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-10
          path: release-part-10
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-11
          path: release-part-11
          if-no-files-found: ignore
