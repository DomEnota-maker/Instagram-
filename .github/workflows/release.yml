name: Android release

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Export apksigner tool
        run: cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: apksigner-tool
          path: apksigner.jar
          retention-days: 1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test, lint and assemble release
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Split release APK
        run: |
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk
          split -b 20m -d -a 2 app/build/outputs/apk/release/app-release-unsigned.apk release-part-
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-00
          path: release-part-00
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-01
          path: release-part-01
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-02
          path: release-part-02
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-03
          path: release-part-03
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-04
          path: release-part-04
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-05
          path: release-part-05
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-06
          path: release-part-06
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-07
          path: release-part-07
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-08
          path: release-part-08
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-09
          path: release-part-09
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-10
          path: release-part-10
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: MediaLoader-release-part-11
          path: release-part-11
          if-no-files-found: ignore
          retention-days: 1
