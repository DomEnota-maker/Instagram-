plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.domenota.medialoader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.domenota.medialoader'
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName '1.4.1'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// Keep the proven 1.0.0 launcher-icon scheme: one ordinary bitmap in drawable-nodpi.
// The source artwork is stored as text so GitHub's API-only workflow can version it reliably.
def prepareLauncherIcon = tasks.register('prepareLauncherIcon') {
    inputs.file(file('src/main/launcher_icon_141.b64'))
    outputs.file(file('src/main/res/drawable-nodpi/ic_launcher.jpg'))
    doLast {
        def source = file('src/main/launcher_icon_141.b64')
        def target = file('src/main/res/drawable-nodpi/ic_launcher.jpg')
        target.parentFile.mkdirs()
        target.bytes = java.util.Base64.getDecoder().decode(source.text.trim())
    }
}

tasks.configureEach { task ->
    if (task.name == 'preBuild') task.dependsOn(prepareLauncherIcon)
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.00')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.8.3'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // Audio-only LGPL build with libmp3lame; actual transcoding, not an extension change.
    implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-audio:8.1.7'
    // The audio AAR references this class at runtime; this variant does not bring it into the APK.
    implementation 'com.arthenica:smart-exception-java:0.2.1'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
